name: CI-CD Demo
 
on:
  push:
    branches: [main]
 
jobs:
  ci:
    name: Build y Test (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
 
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - name: Instalar dependencias
        run: npm install
 
      - name: Ejecutar tests
        run: npm test